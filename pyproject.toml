[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dynamic-regulation-policy-compiler"
version = "0.1.0"
description = "Compile versioned regulations and institutional rules into deterministic backend decision policies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regulation_policy_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
